global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:

  # ---------------------------------------
  # FOODFAST PROJECT
  # ---------------------------------------
  - job_name: "foodfast"
    metrics_path: "/metrics"
    scheme: "https"
    static_configs:
      - targets:
          - "foodfast-production-190a.up.railway.app"
        labels:
          namespace: "foodfast"
          project: "foodfast"

  # ---------------------------------------
  # FOG PROJECT
  # ---------------------------------------
  - job_name: "fog"
    metrics_path: "/metrics"
    scheme: "https"
    static_configs:
      - targets:
          - "sgu25doanktpm-production-6c01.up.railway.app"
        labels:
          namespace: "fog"
          project: "fog"

  # ---------------------------------------
  # FOODFAST CICD EXPORTER
  # ---------------------------------------
  - job_name: "foodfastcicd"
    metrics_path: "/metrics"
    scheme: "http"
    static_configs:
      - targets:
          - "3.83.237.242:5000"
        labels:
          namespace: "foodfastcicd"
          project: "foodfastcicd"
